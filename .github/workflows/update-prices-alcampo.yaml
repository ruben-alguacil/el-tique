name: Actualizar precios Alcampo

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar precios
        run: python scrape_alcampo.py > prices_alcampo.json

      - name: Subir el archivo actualizado
        run: |
          git config user.name "el-tique-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices_alcampo.json
          git diff --quiet --cached || git commit -m "Actualiza precios Alcampo $(date -u +%F)"
          git push
