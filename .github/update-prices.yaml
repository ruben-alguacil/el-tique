name: Actualizar precios Mercadona

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 06:00-07:00 en Madrid según el horario
  workflow_dispatch: {}    # te deja pulsar "Run workflow" a mano cuando quieras

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar precios
        run: python scrape_mercadona.py > prices_mercadona.json

      - name: Subir el archivo actualizado
        run: |
          git config user.name "el-tique-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices_mercadona.json
          git diff --quiet --cached || git commit -m "Actualiza precios Mercadona $(date -u +%F)"
          git push
